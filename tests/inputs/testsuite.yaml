# testsuite.yaml — MOLGW test suite database
#
# Each entry defines one test:
#
#   <input_file>.in:
#       description: Human-readable description of the test
#       keywords: [KW1, KW2, ...]    # used by --keyword filter in run_testsuite.py
#       requirements: [HAVE_X, ...]  # omitted when empty; test is skipped if library absent
#       dependence: [other.in, ...]  # omitted when empty; listed tests must run first
#       conflicts: [HAVE_X, ...]     # optional; test is skipped if any listed library is compiled in
#       checks:
#       -   "Output line key":
#               reference: <float>   # expected numerical value
#               tolerance: <float>   # absolute tolerance
#               column: <int>        # word index on matched output line (default: 0)
#
# Available keywords:
#   HF               Hartree-Fock (no exchange-correlation)
#   DFT              DFT with local or semi-local functional (LDA, GGA)
#   hybrid           Hybrid DFT (fixed fraction or range-separated HF exchange)
#   GW               GW, QSGW, or COHSEX self-energy
#   vertex           Vertex corrections beyond GW (SOSEX, SOX, G3W2, sigma_TDHF)
#   MP2              MP2, MP3, PT2/PT3, or double-hybrid DFT
#   RPA              Random phase approximation correlation energy
#   BSE              Bethe-Salpeter equation excitation energies
#   LR-TDDFT         Linear-response TDDFT or TDHF
#   RT-TDDFT         Real-time TDDFT propagation
#   CI               Configuration interaction (Full-CI, CI-SD, Davidson)
#   NOFT             Natural orbital functional theory
#   noRI             No resolution-of-identity (no auxiliary basis)
#   spin-unrestricted Open-shell spin-unrestricted calculation (nspin=2)
#   ECP              Effective core potential (PP, GTH, or numerical pseudopotential)
#   PBC              Periodic boundary conditions
#   stopping         Stopping cross section calculation
#   density-matrix   Correlated density matrix (pt_density_matrix input variable)
#
# Available requirements:
#   HAVE_SCALAPACK   ScaLAPACK distributed linear algebra
#   HAVE_GRADIENTS   Analytical gradients
#   HAVE_FORCES      Atomic forces
#   HAVE_LIBCINT     LIBCINT integral library
#   HAVE_FFTW3       FFTW3 fast Fourier transform library
#

